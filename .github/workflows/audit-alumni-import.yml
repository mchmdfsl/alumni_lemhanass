name: Audit alumni import (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumni-import-audit
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::GitHub Actions Secret DATABASE_URL belum tersedia atau kosong."
            echo "Buka Settings > Secrets and variables > Actions, lalu buat repository secret bernama DATABASE_URL."
            exit 1
          fi
          echo "DATABASE_URL tersedia. Nilainya tidak akan dicetak."

      - name: Install database client
        run: npm install --no-save --package-lock=false postgres

      - name: Run read-only import simulation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: require
        run: node scripts/import-staging-to-alumni.mjs
